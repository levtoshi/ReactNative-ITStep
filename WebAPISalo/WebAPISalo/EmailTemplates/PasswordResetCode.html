<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Відновлення пароля</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:32px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px;font-size:22px;color:#0f172a;">Відновлення пароля</h1>
              <p style="margin:0 0 12px;color:#334155;font-size:15px;line-height:1.5;">
                Ми отримали запит на відновлення пароля для облікового запису <strong>{{Email}}</strong>.
              </p>
              <p style="margin:0 0 8px;color:#334155;font-size:15px;">Ваш код підтвердження:</p>
              <div style="margin:0 0 24px;padding:16px;background:#eef2ff;border-radius:8px;text-align:center;font-size:28px;letter-spacing:6px;font-weight:bold;color:#3730a3;">{{Code}}</div>
              <p style="margin:0 0 12px;color:#64748b;font-size:13px;line-height:1.5;">Нікому не повідомляйте цей код.</p>
              <p style="margin:0;color:#64748b;font-size:13px;line-height:1.5;">
                Якщо ви не запитували відновлення пароля, просто проігноруйте цей лист. Ваш пароль залишиться без змін.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
